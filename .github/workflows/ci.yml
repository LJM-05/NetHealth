name: NetHealth CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Compile all Java files into a dedicated bin directory
    - name: Compile Java Sources
      run: |
        mkdir -p bin
        find . -name "*.java" ! -path "./bin/*" > sources.txt
        javac -d bin @sources.txt

    # Dynamically find the class name (handling packages) and execute
    - name: Run NetHealth Probe Test
      run: |
        CLASS_FILE=$(find bin -name "NetHealth.class" | head -n 1)
        # Convert path bin/com/example/NetHealth.class -> com.example.NetHealth
        FULL_CLASS=$(echo "$CLASS_FILE" | sed 's|bin/||' | sed 's|\.class||' | tr '/' '.')
        echo "Executing class: $FULL_CLASS"
        java -cp bin "$FULL_CLASS"