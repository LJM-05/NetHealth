name: NetHealth CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Finds and compiles all Java files automatically
    - name: Compile Java Sources
      run: |
        find . -name "*.java" > sources.txt
        javac @sources.txt

    # Finds the compiled .class directory and runs NetHealth
    - name: Run NetHealth Probe Test
      run: |
        CLASS_DIR=$(find . -name "NetHealth.class" -exec dirname {} \;)
        java -cp "$CLASS_DIR:." NetHealth